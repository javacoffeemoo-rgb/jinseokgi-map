<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진석기시대 방문 장소 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root{
    --city:#2563eb; --island:#16a34a; --port:#ea580c; --nature:#0d9488; --abroad:#9333ea;
    --bg:#0f172a; --panel:#111827; --line:#1f2937; --txt:#e5e7eb; --dim:#94a3b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  #app{display:flex;height:100vh;height:100dvh;overflow:hidden}
  #side{width:360px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:18px;letter-spacing:-.3px}
  .sub{font-size:12px;color:var(--dim);line-height:1.5}
  .stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .stat b{display:block;font-size:17px}
  .stat span{font-size:11px;color:var(--dim)}
  #filters{padding:12px 16px;border-bottom:1px solid var(--line)}
  .ftitle{font-size:11px;color:var(--dim);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 9px;border-radius:999px;
        border:1px solid var(--line);background:#0b1220;cursor:pointer;user-select:none;color:var(--dim)}
  .chip.on{color:#fff;border-color:#3b82f6;background:#1e3a8a}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  #list{flex:1;overflow:auto;padding:6px 8px 20px}
  .row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer}
  .row:hover{background:#1b2436}
  .row.active{background:#1e3a8a55;outline:1px solid #3b82f6}
  .row .dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:none}
  .row .nm{font-size:13.5px;font-weight:600}
  .row .ds{font-size:11px;color:var(--dim);margin-top:2px}
  .row .ct{margin-left:auto;font-size:11px;color:var(--dim);background:#0b1220;border:1px solid var(--line);
           border-radius:999px;padding:2px 8px;flex:none}
  #mapwrap{flex:1;min-width:0;position:relative;display:flex}
  #map{flex:1;min-width:0}
  .leaflet-popup-content{font-family:inherit}
  .pv{min-width:0;max-width:min(340px,84vw)}
  .pv h3{margin:0 0 2px;font-size:15px}
  .pv .pm{font-size:11px;color:#64748b;margin-bottom:8px}
  .pv ul{margin:0;padding:0;list-style:none;max-height:330px;overflow:auto}
  .pv li{padding:7px 0;border-top:1px solid #e2e8f0}
  .pv a{color:#1d4ed8;text-decoration:none;font-size:12.5px;font-weight:600;line-height:1.35;display:block}
  .pv a:hover{text-decoration:underline}
  .pv .meta{font-size:10.5px;color:#64748b;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#eef2ff;color:#3730a3;border-radius:4px;padding:1px 5px;font-weight:600}
  .tag.d{background:#f1f5f9;color:#475569}
  .legend{font-size:11px;color:#334155;background:rgba(255,255,255,.92);padding:7px 9px;border-radius:8px;
          box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.7}
  .lgd{display:flex;align-items:center;gap:6px}
  .lgd i{width:10px;height:10px;border-radius:50%;display:inline-block}
  /* ---------- 모바일 / 좁은 화면 ---------- */
  #mapToggle{display:none}
  @media (max-width: 820px){
    #app{flex-direction:column-reverse}
    #side{width:100%;min-width:0;max-height:56vh;border-right:0;border-top:1px solid var(--line)}
    #head{padding:12px 14px 10px}
    h1{font-size:16px}
    .sub{font-size:11px}
    .stats{gap:6px;margin-top:9px}
    .stat{padding:6px 8px;border-radius:8px}
    .stat b{font-size:15px}
    #filters{padding:10px 14px}
    #list{padding:4px 6px 16px}
    #mapwrap{min-height:44vh}
    #app.collapsed #side{display:none}
    #app.collapsed #mapwrap{min-height:100%}
    #mapToggle{display:flex;position:absolute;left:12px;bottom:12px;z-index:900;
      align-items:center;gap:6px;background:#1d4ed8;color:#fff;border:0;border-radius:999px;
      padding:9px 15px;font-size:13px;font-weight:700;font-family:inherit;
      box-shadow:0 3px 10px rgba(0,0,0,.45);cursor:pointer}
    .legend{font-size:10px;padding:5px 7px;line-height:1.5}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="head">
      <h1>진석기시대 방문 장소 지도</h1>
      <div class="sub">유튜브 채널 <b>진석기시대</b>의 영상 <b>471개</b>(2019.02~2026.10)에서 <b>제목 · 태그(숨김 키워드) · 설명</b>에

      <div class="stats">
        <div class="stat"><b id="s1"></b><span>분석 영상</span></div>
        <div class="stat"><b id="s2"></b><span>표시 장소</span></div>
        <div class="stat"><b id="s3"></b><span>위치 확인 영상</span></div>
      </div>
    </div>
    <div id="filters">
      <p class="ftitle">근거 (중복 선택)</p>
      <div class="chips" id="srcChips"></div>
      <div class="sub" style="margin-top:8px">기본은 세 항목 모두 표시. <b>설명</b>은 영상 설명란·해시태그 근거라
        제목/태그보다 약간 넓게 잡힙니다.</div>
      <p class="ftitle" style="margin-top:12px">분류</p>
      <div class="chips" id="catChips"></div>
    </div>
    <div id="list"></div>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <button id="mapToggle" type="button">⤢ 지도 크게</button>
  </div>
</div>

  if (typeof L.markerClusterGroup === "function"){
    return L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:52,
      iconCreateFunction: c => L.divIcon({html:'<div style="background:#1d4ed8;color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)">'+c.getChildCount()+'</div>', className:'', iconSize:[34,34]})});
  }
  return L.layerGroup();
}
cluster = makeLayer();
map.addLayer(cluster);

function videosOf(p){
  return p.v.filter(v => v.w.some(w => activeSrc.has(w)));
}
function radius(p, n){
  return Math.max(6, Math.min(22, 6 + Math.sqrt(n)*3.1));
}
function popupHtml(p, n){
  const items = videosOf(p).map(v=>{
    const badges = v.w.map(w=>`<span class="tag${w==="설명"?" d":""}">${w}</span>`).join("");
    return `<li><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${v.t}</a>
      <div class="meta"><span>${v.d}</span>${badges}</div></li>`;
  }).join("");
  return `<div class="pv"><h3>${p.n}</h3>
    <div class="pm">${cats[p.c][0]}${p.r ? " · " + p.r : ""} · 영상 ${n}개</div><ul>${items}</ul></div>`;
}

let markers = [];
function draw(){
  cluster.clearLayers();
  markers = [];
  const listEl = document.getElementById("list");
  listEl.innerHTML = "";
  const shown = [];
  places.forEach(p=>{
    if (!activeCat.has(p.c)) return;
    const n = videosOf(p).length;
    if (n === 0) return;
    shown.push([p,n]);
    const m = L.circleMarker([p.lat,p.lon], {
      radius: radius(p,n), color:"#fff", weight:1.5,
      fillColor: cats[p.c][1], fillOpacity:.92
    });
    m.bindPopup(()=>popupHtml(p, videosOf(p).length),
      {maxWidth: Math.min(360, Math.floor(window.innerWidth * 0.84))});
    cluster.addLayer(m);
    markers.push({p, m});
  });
  shown.sort((a,b)=> b[1]-a[1] || a[0].n.localeCompare(b[0].n));
  shown.forEach(([p,n])=>{
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<span class="dot" style="background:${cats[p.c][1]}"></span>
      <div><div class="nm">${p.n}</div><div class="ds">${cats[p.c][0]}${p.r ? " · " + p.r : ""}</div></div>
      <span class="ct">${n}</span>`;
    el.onclick = ()=>{
      document.querySelectorAll(".row").forEach(r=>r.classList.remove("active"));
      el.classList.add("active");
      if (cluster.zoomToShowLayer) cluster.zoomToShowLayer(markers.find(x=>x.p===p).m, ()=>markers.find(x=>x.p===p).m.openPopup());
      else { map.setView([p.lat,p.lon], 12); markers.find(x=>x.p===p).m.openPopup(); }
    };
    listEl.appendChild(el);
  });
}

// filters
const srcChips = document.getElementById("srcChips");
srcKeys.forEach(([k,col])=>{
  const c = document.createElement("div");
  c.className = "chip on"; c.innerHTML = `<span class="dot" style="background:${col}"></span>${k}`;
  c.onclick = ()=>{ if(activeSrc.has(k)) activeSrc.delete(k); else activeSrc.add(k);
    c.classList.toggle("on"); draw(); };
  srcChips.appendChild(c);
});
const catChips = document.getElementById("catChips");
Object.keys(cats).filter(c=>catCount[c] > 0).forEach(k=>{
  const c = document.createElement("div");
  c.className = "chip on";
  c.innerHTML = `<span class="dot" style="background:${cats[k][1]}"></span>${cats[k][0]} <b style="opacity:.6">${catCount[k]}</b>`;
  c.onclick = ()=>{ if(activeCat.has(k)) activeCat.delete(k); else activeCat.add(k);
    c.classList.toggle("on"); draw(); };
  catChips.appendChild(c);
});

// legend
const legend = L.control({position:"bottomright"});
legend.onAdd = ()=>{
  const d = L.DomUtil.create("div","legend");
  d.innerHTML = Object.keys(cats).filter(c=>catCount[c] > 0).map(k=>
    `<div class="lgd"><i style="background:${cats[k][1]}"></i>${cats[k][0]} <span style="opacity:.55">${catCount[k]}</span></div>`).join("");
  return d;
};
legend.addTo(map);

// ---------- 반응형 / 지도 크기 보정 ----------
function refreshMap(){ map.invalidateSize(); }
window.addEventListener("resize", refreshMap);
window.addEventListener("orientationchange", ()=>window.setTimeout(refreshMap, 250));

const appEl = document.getElementById("app");
const tgl = document.getElementById("mapToggle");
tgl.onclick = ()=>{
  const collapsed = appEl.classList.toggle("collapsed");
  tgl.textContent = collapsed ? "≡ 목록 보기" : "⤢ 지도 크게";
  window.setTimeout(refreshMap, 60);
};

draw();

// 국내 지점에 맞춰 초기 화면 자동 맞춤 (해외 제외)
function fitDomestic(){
  const pts = markers.filter(x => x.p.c !== "abroad").map(x => [x.p.lat, x.p.lon]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), {padding:[24,24]});
}
fitDomestic();

window.addEventListener("load", ()=>window.setTimeout(refreshMap, 200));
</script>
</body>
</html>
